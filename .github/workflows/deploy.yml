name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
# Par défaut, les jobs n'ont qu'un accès en lecture au dépôt.
permissions:
  contents: read
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Les actions sont épinglées sur un commit précis (le commentaire indique la version) ;
      # Dependabot propose les mises à jour.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3
        with: { node-version: 22 } # même version de Node que la CI
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Seul le job de déploiement peut publier sur GitHub Pages.
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
